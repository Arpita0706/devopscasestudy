---
- hosts: web
  become: yes
  tasks:
    - name: Install Docker
      amazon.aws.aws_package:
        name: docker
        state: present

    - name: Start Docker
      service:
        name: docker
        state: started
        enabled: yes

    - name: Pull Docker image
      command: docker pull yourhubusername/myapp:latest

    - name: Run Docker container
      command: docker run -d -p 80:3000 yourhubusername/myapp:latest
